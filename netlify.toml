[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # These values are public by design (they ship in the browser bundle), so Netlify's secret scanner must not fail the build on them.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_CLIENT_PHONE,NEXT_PUBLIC_CLIENT_WHATSAPP,NEXT_PUBLIC_CLIENT_EMAIL,NEXT_PUBLIC_TURNSTILE_KEY,NEXT_PUBLIC_GTM_ID,NEXT_PUBLIC_GA4_ID,NEXT_PUBLIC_GSC_VERIFICATION,NEXT_PUBLIC_META_PIXEL_ID,NEXT_PUBLIC_TIKTOK_PIXEL_ID"

# Netlify detects Next.js and applies its adapter automatically.
# Set all variables from .env.example in Site configuration > Environment variables.

# One canonical address: send the old Netlify subdomain to the real domain (keeps SEO and login cookies on one site).
[[redirects]]
  from = "https://pearlscholars.netlify.app/*"
  to = "https://pearlscholarsfursa.com/:splat"
  status = 301
  force = true
